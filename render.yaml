services:
  - type: web
    name: goalsave-sc6113
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: CHAIN_ID
        value: "11155111"
      - key: CONTRACT_ADDRESS
        sync: false
      - key: DEPLOYMENT_BLOCK
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
